server:
  port: 8090

spring:
  datasource:
    url: jdbc:h2:mem:fraud-workflow;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: sa
    driver-class-name: org.h2.Driver

camunda:
  bpm:
    admin-user:
      id: demo
      password: demo
    filter:
      create: All tasks
    database:
      schema-update: true
    history-level: full

logging:
  level:
    com.example.fraudworkflow: INFO
